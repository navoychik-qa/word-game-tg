<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Battle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- ТЕМЫ --- */
        :root, [data-theme="dark"] {
            --bg: #17212b;
            --text: #ffffff;
            --hint: #7f91a4;
            --btn: #5288c1;
            --btn-text: #ffffff;
            --secondary-bg: #232e3c;
            --danger: #e53935;
            --success: #4CAF50;
            --gold: #FFD700;
            --locked-bg: #2c3947;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --text: #000000;
            --hint: #999999;
            --btn: #2481cc;
            --btn-text: #ffffff;
            --secondary-bg: #f1f1f1;
            --danger: #d32f2f;
            --success: #388e3c;
            --gold: #d4af37; /* Темнее золото для светлого фона */
            --locked-bg: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 15px; display: flex; flex-direction: column;
            align-items: center; height: 100vh; box-sizing: border-box; overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* Экраны */
        .screen { display: none; width: 100%; max-width: 400px; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }

        /* Меню */
        .menu-header { position: relative; display: flex; justify-content: center; align-items: center; margin-top: 20px; margin-bottom: 10px; }
        .menu-title { font-size: 32px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin: 0; }
        .theme-toggle { 
            position: absolute; right: 0; background: none; border: none; font-size: 24px; 
            cursor: pointer; padding: 5px; transition: transform 0.2s;
        }
        .theme-toggle:active { transform: scale(0.8); }
        
        .balance { font-size: 18px; color: var(--gold); text-align: center; margin-bottom: 20px; font-weight: bold; }
        .btn {
            background-color: var(--btn); color: var(--btn-text);
            border: none; padding: 16px; border-radius: 12px;
            font-size: 18px; font-weight: 600; margin-bottom: 12px; cursor: pointer;
            transition: transform 0.1s; width: 100%; box-sizing: border-box;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; background-color: var(--hint); cursor: not-allowed; }
        .btn-secondary { background-color: var(--secondary-bg); color: var(--text); border: 1px solid var(--hint); }
        .btn-pvp { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
        .btn-reset { background: transparent; color: var(--danger); border: 1px solid var(--danger); font-size: 14px; margin-top: auto; margin-bottom: 20px; }

        /* Выбор уровней */
        .level-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            overflow-y: auto; padding: 10px 0; flex: 1; align-content: start;
        }
        .level-btn {
            aspect-ratio: 1; border-radius: 12px; border: none; font-size: 18px; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            background-color: var(--secondary-bg); color: var(--text); cursor: pointer;
            border-bottom: 4px solid rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .level-btn:active { transform: scale(0.95); }
        .level-btn.completed { background-color: var(--success); color: white; border-bottom-color: rgba(0,0,0,0.4); }
        .level-btn.locked { background-color: var(--locked-bg); color: var(--hint); cursor: not-allowed; border-bottom-color: rgba(0,0,0,0.1); }
        .level-btn.current { border: 2px solid var(--gold); }

        /* Игра */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text); padding: 0; }
        .level-info { font-size: 18px; font-weight: bold; }
        .bonus-badge { color: var(--gold); font-weight: bold; font-size: 16px; }

        .task-card {
            background-color: var(--secondary-bg); padding: 15px; border-radius: 16px;
            text-align: center; margin-bottom: 15px; border: 1px solid rgba(128,128,128,0.2);
        }
        .task-title { font-size: 14px; color: var(--hint); margin-bottom: 5px; text-transform: uppercase; }
        .task-word { font-size: 20px; font-weight: bold; color: var(--btn); }

        .action-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .action-btn {
            flex: 1; background: rgba(212, 175, 55, 0.1); color: var(--gold);
            border: 1px solid var(--gold); border-radius: 8px; padding: 8px;
            font-size: 12px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center;
        }
        .action-btn span { font-size: 10px; opacity: 0.8; }
        .action-btn:active { background: rgba(212, 175, 55, 0.2); }

        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input {
            flex: 1; padding: 16px; border-radius: 12px; border: 1px solid var(--hint);
            background-color: var(--secondary-bg); color: var(--text); font-size: 16px; outline: none;
        }
        input:focus { border-color: var(--btn); }
        .submit-btn {
            background-color: var(--btn); color: var(--btn-text); border: none;
            padding: 0 20px; border-radius: 12px; font-size: 24px; font-weight: bold; cursor: pointer;
        }

        .words-list { flex: 1; overflow-y: auto; padding-bottom: 10px; }
        .word-item {
            background-color: var(--secondary-bg); padding: 10px 15px; border-radius: 8px;
            margin-bottom: 8px; font-size: 16px; display: flex; justify-content: space-between;
            animation: slideIn 0.2s ease-out; border-left: 4px solid var(--success);
        }
        .word-item span:last-child { color: var(--success); font-weight: bold; }
        .progress { font-size: 16px; font-weight: bold; color: var(--btn); text-align: center; margin-top: 10px; }

        /* Загрузка */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; justify-content: center; align-items: center;
            flex-direction: column; z-index: 999;
        }
        .spinner {
            border: 4px solid var(--secondary-bg); border-top: 4px solid var(--btn);
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes slideIn {
            from { transform: translateX(-10px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Заглушка для PvP */
        .pvp-mockup {
            flex: 1; display: flex; flex-direction: column; justify-content: space-between;
            background: linear-gradient(180deg, #2b1055 0%, #7597de 100%);
            border-radius: 16px; padding: 20px; text-align: center; color: white;
        }
        .pvp-timer { font-size: 32px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 20px; border-radius: 20px; margin: 0 auto 10px auto; width: fit-content; }
        .pvp-abilities { display: flex; gap: 5px; justify-content: center; margin-bottom: 10px; }
        .pvp-ability { width: 50px; height: 50px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; border: 2px solid white; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">Загрузка словаря...</div>
    </div>

    <!-- ЭКРАН 1: Главное меню -->
    <div id="screen-menu" class="screen active">
        <div class="menu-header">
            <div class="menu-title">Word Battle</div>
            <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">☀️</button>
        </div>
        
        <div class="balance">🪙 <span id="menu-balance">0</span> бонусов</div>
        
        <button id="btn-start" class="btn" onclick="showLevelSelect()" disabled>Загрузка...</button>
        <button class="btn btn-pvp" onclick="showPvpMockup()">⚔️ Один на один (PvP)</button>
        <button class="btn btn-secondary" onclick="tg.showAlert('Рейтинг и турниры в разработке!')">🏆 Рейтинг игроков</button>
        
        <button id="btn-reset" class="btn btn-reset" onclick="resetProgress()" style="display: none;">Сбросить прогресс</button>
    </div>

    <!-- ЭКРАН 2: Выбор уровней -->
    <div id="screen-levels" class="screen">
        <div class="header">
            <button class="back-btn" onclick="goToMenu()">←</button>
            <div class="level-info">Выбор уровня</div>
            <div class="bonus-badge">🪙 <span id="levels-balance">0</span></div>
        </div>
        <div class="level-grid" id="level-grid"></div>
    </div>

    <!-- ЭКРАН 3: Игра -->
    <div id="screen-game" class="screen">
        <div class="header">
            <!-- ИЗМЕНЕНО: Вызов окна подтверждения -->
            <button class="back-btn" onclick="confirmLeaveLevel()">←</button>
            <div class="level-info" id="level-display">Уровень 1</div>
            <div class="bonus-badge">🪙 <span id="game-balance">0</span></div>
        </div>

        <div class="task-card">
            <div class="task-title">Твоё задание:</div>
            <div class="task-word" id="current-task">Загрузка...</div>
        </div>

        <div class="action-buttons">
            <button class="action-btn" onclick="changeLetter()">Сменить букву <span>(10 🪙)</span></button>
            <button class="action-btn" onclick="changeCondition()">Сменить условие <span>(15 🪙)</span></button>
        </div>

        <div class="input-group">
            <input type="text" id="word-input" placeholder="Введи слово..." autocomplete="off">
            <button class="submit-btn" onclick="checkWord()">→</button>
        </div>

        <div class="words-list" id="words-container"></div>
        <div class="progress" id="progress-text">Введено: 0 / 0</div>
    </div>

    <!-- ЭКРАН 4: PvP Заглушка -->
    <div id="screen-pvp" class="screen">
        <div class="header">
            <button class="back-btn" onclick="goToMenu()">←</button>
            <div class="level-info">Битва 1 на 1</div>
            <div style="width: 24px;"></div>
        </div>
        <div class="pvp-mockup">
            <div>
                <div>👤 Враг: Player2</div>
                <div style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">Счет: 4</div>
                <div style="height: 80px; background: rgba(0,0,0,0.3); border-radius: 8px; display: flex; justify-content: center; align-items: center;">[Скин врага]</div>
            </div>
            <div class="pvp-timer">00:15</div>
            <div>
                <div class="pvp-abilities">
                    <div class="pvp-ability">🔄</div>
                    <div class="pvp-ability">📝</div>
                    <div class="pvp-ability">🥷</div>
                    <div class="pvp-ability">🗑️</div>
                </div>
                <div class="input-group" style="margin-bottom: 5px;">
                    <input type="text" placeholder="Введи слово..." disabled>
                    <button class="submit-btn" disabled>→</button>
                </div>
                <div style="height: 80px; background: rgba(0,0,0,0.3); border-radius: 8px; display: flex; justify-content: center; align-items: center;">[Твой скин]</div>
                <div style="font-size: 24px; font-weight: bold; margin-top: 5px;">Счет: 2</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // --- ДАННЫЕ ---
        let dictionary = new Set();
        let enteredWords = [];
        
        let maxUnlockedLevel = parseInt(localStorage.getItem('wordBattleMaxUnlocked') || '1');
        let currentLevelIndex = 1;
        let bonusBalance = parseInt(localStorage.getItem('wordBattleBonus') || '50');

        const TOTAL_LEVELS = 50;
        const allLevels = [];

        // --- ТЕМА ---
        function initTheme() {
            const savedTheme = localStorage.getItem('wordBattleTheme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('wordBattleTheme', next);
            updateThemeIcon(next);
            tg.HapticFeedback.impactOccurred('light');
        }

        function updateThemeIcon(theme) {
            document.getElementById('theme-toggle').innerText = theme === 'dark' ? '☀️' : '🌙';
        }

        // Вызываем инициализацию темы сразу
        initTheme();

        // Создаем уровни при запуске
        function generateLevels() {
            const lettersStart = ['к', 'п', 'с', 'р', 'м', 'т', 'б', 'г', 'д', 'в'];
            const lettersEnd = ['а', 'я', 'о', 'и', 'е', 'ы', 'у', 'ь'];
            
            for (let i = 1; i <= TOTAL_LEVELS; i++) {
                let type, val, text, target;

                if (i <= 10) {
                    const idx = i - 1;
                    if (i <= 4) {
                        type = 'startsWith'; val = lettersStart[idx]; 
                        text = `Начинается на "${val.toUpperCase()}"`; target = 3;
                    } else if (i <= 7) {
                        type = 'endsWith'; val = lettersEnd[idx - 4]; 
                        text = `Заканчивается на "${val.toUpperCase()}"`; target = 3;
                    } else {
                        type = 'length'; val = 4 + (idx - 7); 
                        text = `Ровно ${val} букв`; target = 3;
                    }
                } else if (i <= 30) {
                    const idx = i - 11;
                    if (i <= 18) {
                        type = 'startsWith'; val = lettersStart[idx % lettersStart.length]; 
                        text = `Начинается на "${val.toUpperCase()}"`; target = 4;
                    } else if (i <= 25) {
                        type = 'endsWith'; val = lettersEnd[idx % lettersEnd.length]; 
                        text = `Заканчивается на "${val.toUpperCase()}"`; target = 4;
                    } else {
                        type = 'length'; val = 5 + (idx % 4); 
                        text = `Ровно ${val} букв`; target = 4;
                    }
                } else {
                    const idx = i - 31;
                    if (i <= 38) {
                        type = 'contains'; val = lettersEnd[idx % lettersEnd.length]; 
                        text = `Содержит "${val.toUpperCase()}"`; target = 4;
                    } else if (i <= 45) {
                        type = 'startsWith'; val = lettersStart[idx % lettersStart.length]; 
                        text = `Начинается на "${val.toUpperCase()}"`; target = 5;
                    } else {
                        type = 'length'; val = 7 + (idx % 3); 
                        text = `Ровно ${val} букв`; target = 5;
                    }
                }
                allLevels.push({ type, val, text, target });
            }
        }
        generateLevels();

        // --- УТИЛИТЫ ---
        function normalizeWord(word) {
            return word.toLowerCase().replace(/ё/g, 'е').replace(/[^а-я]/g, ''); 
        }

        function updateBalanceUI() {
            document.querySelectorAll('#menu-balance, #levels-balance, #game-balance').forEach(el => el.innerText = bonusBalance);
            localStorage.setItem('wordBattleBonus', bonusBalance);
        }

        function updateMenuUI() {
            const startBtn = document.getElementById('btn-start');
            const resetBtn = document.getElementById('btn-reset');
            
            if (maxUnlockedLevel > 1) {
                startBtn.innerText = `🎮 Продолжить (Ур. ${maxUnlockedLevel})`;
            } else {
                startBtn.innerText = `🎮 Одиночный режим`;
            }
            
            resetBtn.style.display = maxUnlockedLevel > 1 ? 'block' : 'none';
        }

        // --- ЗАГРУЗКА СЛОВАРЯ ---
        async function gunzipToString(arrayBuffer) {
            if (typeof DecompressionStream !== 'undefined') {
                try {
                    const stream = new Blob([arrayBuffer]).stream().pipeThrough(new DecompressionStream('gzip'));
                    return await new Response(stream).text();
                } catch (e) { console.warn('Fallback', e); }
            }
            if (typeof pako === 'undefined') {
                await new Promise((res, rej) => {
                    const s = document.createElement('script');
                    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js';
                    s.onload = res; s.onerror = rej; document.head.appendChild(s);
                });
            }
            return pako.inflate(new Uint8Array(arrayBuffer), { to: 'string' });
        }

        async function loadDictionary() {
            const loadingText = document.getElementById('loading-text');
            try {
                const response = await fetch('words.txt.gz?v=' + Date.now());
                if (!response.ok) throw new Error('Файл не найден');

                const buffer = await response.arrayBuffer();
                let text = await gunzipToString(buffer);
                text = text.replace(/^\uFEFF/, '');

                const wordsArray = text.split(/\r?\n/).map(w => normalizeWord(w)).filter(w => w.length > 0);
                dictionary = new Set(wordsArray);

                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('btn-start').disabled = false;
                
                updateBalanceUI();
                updateMenuUI();
            } catch (error) {
                console.error(error);
                loadingText.style.color = 'red';
                loadingText.innerText = 'Ошибка словаря';
                tg.showAlert('Ошибка: ' + error.message);
            }
        }

        loadDictionary();

        // --- НАВИГАЦИЯ ---
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goToMenu() {
            tg.HapticFeedback.impactOccurred('light');
            updateMenuUI();
            switchScreen('screen-menu');
        }

        function showLevelSelect() {
            tg.HapticFeedback.impactOccurred('light');
            renderLevelGrid();
            switchScreen('screen-levels');
        }

        function showPvpMockup() {
            tg.HapticFeedback.impactOccurred('medium');
            switchScreen('screen-pvp');
        }

        function resetProgress() {
            tg.showConfirm('Сбросить весь прогресс и бонусы?', (ok) => {
                if (ok) {
                    maxUnlockedLevel = 1;
                    bonusBalance = 50;
                    localStorage.setItem('wordBattleMaxUnlocked', 1);
                    localStorage.setItem('wordBattleBonus', 50);
                    updateBalanceUI();
                    updateMenuUI();
                    tg.HapticFeedback.notificationOccurred('success');
                }
            });
        }

        // --- ОТРИСОВКА СЕТКИ УРОВНЕЙ ---
        function renderLevelGrid() {
            const grid = document.getElementById('level-grid');
            grid.innerHTML = '';

            for (let i = 1; i <= TOTAL_LEVELS; i++) {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.innerText = i;

                if (i < maxUnlockedLevel) {
                    btn.classList.add('completed');
                } else if (i === maxUnlockedLevel) {
                    btn.classList.add('current'); 
                } else {
                    btn.classList.add('locked');
                    btn.innerHTML = '🔒';
                }

                if (i <= maxUnlockedLevel) {
                    btn.onclick = () => startLevel(i);
                } else {
                    btn.onclick = () => tg.showAlert('Сначала пройди предыдущие уровни!');
                }

                grid.appendChild(btn);
            }
        }

        // --- ИГРА ---
        function startLevel(levelIndex) {
            tg.HapticFeedback.impactOccurred('medium');
            currentLevelIndex = levelIndex;
            switchScreen('screen-game');
            loadLevel();
        }

        // НОВАЯ ФУНКЦИЯ: Подтверждение выхода
        function confirmLeaveLevel() {
            // Если ни одного слова не введено, выходим без вопросов
            if (enteredWords.length === 0) {
                showLevelSelect();
                return;
            }
            tg.showConfirm('Вы точно хотите покинуть уровень? Весь прогресс будет утерян.', (ok) => {
                if (ok) {
                    showLevelSelect();
                }
            });
        }

        function loadLevel() {
            enteredWords = [];
            document.getElementById('words-container').innerHTML = '';
            document.getElementById('word-input').value = '';

            const level = allLevels[currentLevelIndex - 1];
            
            document.getElementById('level-display').innerText = `Уровень ${currentLevelIndex}`;
            document.getElementById('current-task').innerText = level.text;
            updateProgress();
        }

        function updateProgress() {
            const level = allLevels[currentLevelIndex - 1];
            document.getElementById('progress-text').innerText = `Введено: ${enteredWords.length} / ${level.target}`;
        }

        // --- СПОСОБНОСТИ ---
        function changeLetter() {
            if (bonusBalance < 10) return tg.showAlert('Недостаточно бонусов!');
            const newLetter = prompt("Введите новую букву (например: А, Б, В...):");
            if (!newLetter || !/^[а-яё]$/i.test(newLetter)) return tg.showAlert('Нужна одна русская буква!');
            
            const level = allLevels[currentLevelIndex - 1];
            level.type = 'startsWith';
            level.val = newLetter.toLowerCase();
            level.text = `Начинается на "${newLetter.toUpperCase()}"`;
            
            bonusBalance -= 10;
            updateBalanceUI();
            document.getElementById('current-task').innerText = level.text;
            tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert('Буква изменена!');
        }

        function changeCondition() {
            if (bonusBalance < 15) return tg.showAlert('Недостаточно бонусов!');
            
            const level = allLevels[currentLevelIndex - 1];
            const conditions = [
                { type: 'endsWith', val: 'а', text: 'Заканчивается на "А"' },
                { type: 'contains', val: 'ь', text: 'Содержит "Ь"' },
                { type: 'length', val: 5, text: 'Ровно 5 букв' }
            ];
            const newCond = conditions[Math.floor(Math.random() * conditions.length)];
            
            Object.assign(level, newCond);
            bonusBalance -= 15;
            updateBalanceUI();
            document.getElementById('current-task').innerText = level.text;
            tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert('Условие изменено!');
        }

        // --- ПРОВЕРКА СЛОВ ---
        function checkWord() {
            const input = document.getElementById('word-input');
            const rawWord = input.value.trim();
            const word = normalizeWord(rawWord);

            if (!word) return;

            if (!/^[а-я]+$/.test(word)) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert('Только русские буквы!');
                return;
            }

            if (!dictionary.has(word)) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert('Такого слова нет в словаре!');
                return;
            }

            const level = allLevels[currentLevelIndex - 1];
            let isValid = false;

            if (level.type === 'startsWith') isValid = word.startsWith(level.val);
            else if (level.type === 'endsWith') isValid = word.endsWith(level.val);
            else if (level.type === 'contains') isValid = word.includes(level.val);
            else if (level.type === 'length') isValid = word.length === level.val;

            if (!isValid) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert('Слово не подходит под условие!');
                return;
            }

            if (enteredWords.includes(word)) {
                tg.HapticFeedback.notificationOccurred('warning');
                tg.showAlert('Ты уже вводил это слово!');
                return;
            }

            // Успех
            tg.HapticFeedback.notificationOccurred('success');
            enteredWords.push(word);
            input.value = ''; 
            
            const wordItem = document.createElement('div');
            wordItem.className = 'word-item';
            wordItem.innerHTML = `<span>${rawWord}</span> <span>+1</span>`;
            document.getElementById('words-container').prepend(wordItem);

            updateProgress();

            // ПРОХОЖДЕНИЕ УРОВНЯ
            if (enteredWords.length >= level.target) {
                if (currentLevelIndex === maxUnlockedLevel) {
                    bonusBalance += 20; 
                    maxUnlockedLevel++;
                    localStorage.setItem('wordBattleMaxUnlocked', maxUnlockedLevel);
                    updateBalanceUI();
                    
                    tg.HapticFeedback.notificationOccurred('success');
                    setTimeout(() => {
                        tg.showAlert('Уровень пройден! +20 🪙');
                        showLevelSelect();
                    }, 300);
                } else {
                    tg.HapticFeedback.notificationOccurred('success');
                    setTimeout(() => {
                        tg.showAlert('Уровень пройден!');
                        showLevelSelect();
                    }, 300);
                }
            }
        }

        document.getElementById('word-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkWord();
        });
    </script>
</body>
</html>
