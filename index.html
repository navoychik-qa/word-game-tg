<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Battle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- ТЕМЫ --- */
        :root, [data-theme="dark"] {
            --bg: #17212b;
            --text: #ffffff;
            --hint: #7f91a4;
            --btn: #5288c1;
            --btn-text: #ffffff;
            --secondary-bg: #232e3c;
            --danger: #e53935;
            --success: #4CAF50;
            --gold: #FFD700;
            --locked-bg: #2c3947;
            --tile-bg: #e2b714;
            --tile-text: #17212b;
            --tile-used: #3b4a5a;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --text: #000000;
            --hint: #999999;
            --btn: #2481cc;
            --btn-text: #ffffff;
            --secondary-bg: #f1f1f1;
            --danger: #d32f2f;
            --success: #388e3c;
            --gold: #d4af37;
            --locked-bg: #e0e0e0;
            --tile-bg: #f0d470;
            --tile-text: #000000;
            --tile-used: #cccccc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 15px; display: flex; flex-direction: column;
            align-items: center; height: 100vh; box-sizing: border-box; overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }
        
        .screen { display: none; width: 100%; max-width: 400px; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }

        /* Меню */
        .menu-header { position: relative; display: flex; justify-content: center; align-items: center; margin-top: 20px; margin-bottom: 10px; width: 100%; }
        .menu-title { font-size: 32px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin: 0; }
        .theme-toggle { position: absolute; right: 0; background: none; border: none; font-size: 24px; cursor: pointer; padding: 5px; color: var(--text); z-index: 10; }
        
        .balance { font-size: 18px; color: var(--gold); text-align: center; margin-bottom: 20px; font-weight: bold; }
        .btn {
            background-color: var(--btn); color: var(--btn-text);
            border: none; padding: 16px; border-radius: 12px;
            font-size: 18px; font-weight: 600; margin-bottom: 12px; cursor: pointer;
            transition: transform 0.1s; width: 100%; box-sizing: border-box;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; background-color: var(--hint); cursor: not-allowed; }
        .btn-secondary { background-color: var(--secondary-bg); color: var(--text); border: 1px solid var(--hint); }
        .btn-pvp { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; }
        .btn-reset { background: transparent; color: var(--danger); border: 1px solid var(--danger); font-size: 14px; margin-top: auto; margin-bottom: 20px; }

        /* Выбор уровней */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 12px; text-align: center; background: var(--secondary-bg); color: var(--text); border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .tab.active { background: var(--btn); color: var(--btn-text); }

        .level-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            overflow-y: auto; padding: 10px 0; flex: 1; align-content: start;
        }
        .level-btn {
            aspect-ratio: 1; border-radius: 12px; border: none; font-size: 18px; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            background-color: var(--secondary-bg); color: var(--text); cursor: pointer;
            border-bottom: 4px solid rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        .level-btn:active { transform: scale(0.95); }
        .level-btn.completed { background-color: var(--success); color: white; border-bottom-color: rgba(0,0,0,0.4); }
        .level-btn.locked { background-color: var(--locked-bg); color: var(--hint); cursor: not-allowed; border-bottom-color: rgba(0,0,0,0.1); }
        .level-btn.current { border: 2px solid var(--gold); }

        /* Игра */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-shrink: 0; }
        .back-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text); padding: 0; }
        .level-info { font-size: 18px; font-weight: bold; }
        .bonus-badge { color: var(--gold); font-weight: bold; font-size: 16px; }

        .task-card {
            background-color: var(--secondary-bg); padding: 15px; border-radius: 16px;
            text-align: center; margin-bottom: 10px; border: 1px solid rgba(128,128,128,0.2); flex-shrink: 0;
        }
        .task-title { font-size: 14px; color: var(--hint); margin-bottom: 5px; text-transform: uppercase; }
        .task-word { font-size: 20px; font-weight: bold; color: var(--btn); }

        .action-buttons { display: flex; gap: 10px; margin-bottom: 10px; flex-shrink: 0; }
        .action-btn {
            flex: 1; background: rgba(212, 175, 55, 0.1); color: var(--gold);
            border: 1px solid var(--gold); border-radius: 8px; padding: 8px;
            font-size: 12px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center;
        }
        .action-btn span { font-size: 10px; opacity: 0.8; }

        /* Ввод для Главы 1 */
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; flex-shrink: 0; }
        input {
            flex: 1; padding: 16px; border-radius: 12px; border: 1px solid var(--hint);
            background-color: var(--secondary-bg); color: var(--text); font-size: 16px; outline: none;
        }
        input:focus { border-color: var(--btn); }
        .submit-btn {
            background-color: var(--btn); color: var(--btn-text); border: none;
            padding: 0 20px; border-radius: 12px; font-size: 24px; font-weight: bold; cursor: pointer;
        }

        /* Конструктор для Главы 2 */
        .tiles-container {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            flex: 1; margin-bottom: 10px;
        }
        .current-word-display {
            font-size: 36px; font-weight: bold; letter-spacing: 2px; min-height: 45px;
            color: var(--btn); margin-bottom: 20px; text-transform: uppercase;
            border-bottom: 2px dashed var(--hint); padding-bottom: 5px; min-width: 50px; text-align: center;
        }
        .letters-pool {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px;
        }
        .letter-tile {
            width: 55px; height: 55px; border-radius: 12px;
            background: var(--tile-bg); color: var(--tile-text);
            font-size: 26px; font-weight: bold; display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.2); user-select: none;
            text-transform: uppercase; transition: all 0.1s;
        }
        .letter-tile:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
        .letter-tile.used { background: var(--tile-used); color: var(--hint); box-shadow: none; transform: translateY(4px); cursor: default; }
        
        .tile-controls { display: flex; gap: 15px; width: 100%; justify-content: center; }
        .tile-btn {
            padding: 12px 24px; border-radius: 12px; font-size: 18px; font-weight: bold; border: none; cursor: pointer;
        }
        .tile-btn.backspace { background: var(--secondary-bg); color: var(--text); border: 1px solid var(--hint); }
        .tile-btn.submit { background: var(--success); color: white; flex: 1; max-width: 200px; }

        .words-list { flex: 1; overflow-y: auto; padding-bottom: 10px; min-height: 50px; }
        .word-item {
            background-color: var(--secondary-bg); padding: 10px 15px; border-radius: 8px;
            margin-bottom: 8px; font-size: 16px; display: flex; justify-content: space-between;
            animation: slideIn 0.2s ease-out; border-left: 4px solid var(--success);
        }
        .word-item span:last-child { color: var(--success); font-weight: bold; }
        .progress { font-size: 16px; font-weight: bold; color: var(--btn); text-align: center; margin-top: 10px; flex-shrink: 0; }

        /* Загрузка */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; justify-content: center; align-items: center;
            flex-direction: column; z-index: 999;
        }
        .spinner { border: 4px solid var(--secondary-bg); border-top: 4px solid var(--btn); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 16px; }
        
        @keyframes slideIn { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* PvP */
        .pvp-mockup { flex: 1; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(180deg, #2b1055 0%, #7597de 100%); border-radius: 16px; padding: 20px; text-align: center; color: white; }
        .pvp-timer { font-size: 32px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 20px; border-radius: 20px; margin: 0 auto 10px auto; width: fit-content; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">Загрузка словаря...</div>
    </div>

    <!-- ЭКРАН 1: Главное меню -->
    <div id="screen-menu" class="screen active">
        <div class="menu-header">
            <div class="menu-title">Word Battle</div>
            <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">☀️</button>
        </div>
        
        <div class="balance">🪙 <span id="menu-balance">0</span> бонусов</div>
        
        <button id="btn-start" class="btn" onclick="showLevelSelect()" disabled>Загрузка...</button>
        <button class="btn btn-pvp" onclick="showPvpMockup()">⚔️ Один на один (PvP)</button>
        <button class="btn btn-secondary" onclick="tg.showAlert('Рейтинг и турниры в разработке!')">🏆 Рейтинг игроков</button>
        
        <button id="btn-reset" class="btn btn-reset" onclick="resetProgress()" style="display: none;">Сбросить прогресс</button>
    </div>

    <!-- ЭКРАН 2: Выбор уровней -->
    <div id="screen-levels" class="screen">
        <div class="header">
            <button class="back-btn" onclick="goToMenu()">←</button>
            <div class="level-info">Выбор уровня</div>
            <div class="bonus-badge">🪙 <span id="levels-balance">0</span></div>
        </div>
        
        <div class="tabs">
            <div class="tab active" id="tab-ch1" onclick="switchChapter(1)">Глава 1</div>
            <div class="tab" id="tab-ch2" onclick="switchChapter(2)">Глава 2</div>
        </div>

        <div class="level-grid" id="level-grid"></div>
    </div>

    <!-- ЭКРАН 3: Игра -->
    <div id="screen-game" class="screen">
        <div class="header">
            <button class="back-btn" onclick="confirmLeaveLevel()">←</button>
            <div class="level-info" id="level-display">Уровень 1</div>
            <div class="bonus-badge">🪙 <span id="game-balance">0</span></div>
        </div>

        <div class="task-card">
            <div class="task-title" id="task-title-text">Твоё задание:</div>
            <div class="task-word" id="current-task">Загрузка...</div>
        </div>

        <div class="action-buttons">
            <button class="action-btn" onclick="changeLetter()">Сменить букву <span>(10 🪙)</span></button>
            <button class="action-btn" onclick="changeCondition()">Сменить условие <span>(15 🪙)</span></button>
        </div>

        <!-- Ввод с клавиатуры (Глава 1) -->
        <div class="input-group" id="keyboard-input-group">
            <input type="text" id="word-input" placeholder="Введи слово..." autocomplete="off">
            <button class="submit-btn" onclick="checkWord()">→</button>
        </div>

        <!-- Конструктор из букв (Глава 2) -->
        <div class="tiles-container" id="tiles-container">
            <div class="current-word-display" id="current-word-display"></div>
            <div class="letters-pool" id="letters-pool"></div>
            <div class="tile-controls">
                <button class="tile-btn backspace" onclick="backspaceTile()">⌫</button>
                <button class="tile-btn submit" onclick="submitTileWord()">Проверить</button>
            </div>
        </div>

        <div class="words-list" id="words-container"></div>
        <div class="progress" id="progress-text">Введено: 0 / 0</div>
    </div>

    <!-- ЭКРАН 4: PvP Заглушка -->
    <div id="screen-pvp" class="screen">
        <div class="header">
            <button class="back-btn" onclick="goToMenu()">←</button>
            <div class="level-info">Битва 1 на 1</div>
            <div style="width: 24px;"></div>
        </div>
        <div class="pvp-mockup">
            <div>
                <div>👤 Враг: Player2</div>
                <div style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">Счет: 4</div>
                <div style="height: 80px; background: rgba(0,0,0,0.3); border-radius: 8px; display: flex; justify-content: center; align-items: center;">[Скин врага]</div>
            </div>
            <div class="pvp-timer">00:15</div>
            <div>
                <div style="height: 80px; background: rgba(0,0,0,0.3); border-radius: 8px; display: flex; justify-content: center; align-items: center; margin-top: 10px;">[Твой скин]</div>
                <div style="font-size: 24px; font-weight: bold; margin-top: 5px;">Счет: 2</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // --- ДАННЫЕ ---
        let dictionary = new Set();
        let enteredWords = [];
        
        let maxUnlockedLevel = parseInt(localStorage.getItem('wordBattleMaxUnlocked') || '1');
        let currentLevelIndex = 1;
        let bonusBalance = parseInt(localStorage.getItem('wordBattleBonus') || '50');
        let currentChapterView = 1;

        let currentWord = "";
        let selectedTileElements = [];

        const TOTAL_LEVELS = 100;
        const allLevels = [];

        // --- ТЕМА ---
        function initTheme() {
            const savedTheme = localStorage.getItem('wordBattleTheme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('wordBattleTheme', next);
            updateThemeIcon(next);
            tg.HapticFeedback.impactOccurred('light');
        }

        function updateThemeIcon(theme) {
            document.getElementById('theme-toggle').innerText = theme === 'dark' ? '☀️' : '🌙';
        }

        initTheme();

        // --- ГЕНЕРАТОР УРОВНЕЙ ---
        function generateLevels() {
            const lettersStart = ['к', 'п', 'с', 'р', 'м', 'т', 'б', 'г', 'д', 'в'];
            const lettersEnd = ['а', 'я', 'о', 'и', 'е', 'ы', 'у', 'ь'];
            
            for (let i = 1; i <= 50; i++) {
                let type, val, text, target;
                if (i <= 10) {
                    const idx = i - 1;
                    if (i <= 4) { type = 'startsWith'; val = lettersStart[idx]; text = `Начинается на "${val.toUpperCase()}"`; target = 3; }
                    else if (i <= 7) { type = 'endsWith'; val = lettersEnd[idx - 4]; text = `Заканчивается на "${val.toUpperCase()}"`; target = 3; }
                    else { type = 'length'; val = 4 + (idx - 7); text = `Ровно ${val} букв`; target = 3; }
                } else if (i <= 30) {
                    const idx = i - 11;
                    if (i <= 18) { type = 'startsWith'; val = lettersStart[idx % lettersStart.length]; text = `Начинается на "${val.toUpperCase()}"`; target = 4; }
                    else if (i <= 25) { type = 'endsWith'; val = lettersEnd[idx % lettersEnd.length]; text = `Заканчивается на "${val.toUpperCase()}"`; target = 4; }
                    else { type = 'length'; val = 5 + (idx % 4); text = `Ровно ${val} букв`; target = 4; }
                } else {
                    const idx = i - 31;
                    if (i <= 38) { type = 'contains'; val = lettersEnd[idx % lettersEnd.length]; text = `Содержит "${val.toUpperCase()}"`; target = 4; }
                    else if (i <= 45) { type = 'startsWith'; val = lettersStart[idx % lettersStart.length]; text = `Начинается на "${val.toUpperCase()}"`; target = 5; }
                    else { type = 'length'; val = 7 + (idx % 3); text = `Ровно ${val} букв`; target = 5; }
                }
                allLevels.push({ type, val, text, target });
            }

            const vowels = 'аеиоуыэюя';
            const consonants = 'бвгджзклмнпрстфхцчшщ';
            
            for (let i = 51; i <= 100; i++) {
                const idx = i - 51;
                const letterCount = 8 + Math.floor(idx / 10); 
                const target = 3 + Math.floor(idx / 17);
                
                let pool = [];
                const seed = i * 13;
                for (let j = 0; j < letterCount; j++) {
                    if ((seed + j) % 10 < 4) { pool.push(vowels[(seed + j) % vowels.length]); } 
                    else { pool.push(consonants[(seed * 2 + j) % consonants.length]); }
                }
                pool.sort(() => Math.random() - 0.5);

                allLevels.push({ type: 'letters', val: pool, text: `Составь слова из ${letterCount} букв`, target: target });
            }
        }
        generateLevels();

        // --- УТИЛИТЫ ---
        function normalizeWord(word) {
            return word.toLowerCase().replace(/ё/g, 'е').replace(/[^а-я]/g, ''); 
        }

        function updateBalanceUI() {
            document.querySelectorAll('#menu-balance, #levels-balance, #game-balance').forEach(el => el.innerText = bonusBalance);
            localStorage.setItem('wordBattleBonus', bonusBalance);
        }

        function updateMenuUI() {
            const startBtn = document.getElementById('btn-start');
            const resetBtn = document.getElementById('btn-reset');
            
            if (maxUnlockedLevel > 1) {
                startBtn.innerText = `🎮 Продолжить (Ур. ${maxUnlockedLevel})`;
            } else {
                startBtn.innerText = `🎮 Одиночный режим`;
            }
            resetBtn.style.display = maxUnlockedLevel > 1 ? 'block' : 'none';
        }

        // --- ЗАГРУЗКА СЛОВАРЯ ---
        async function gunzipToString(arrayBuffer) {
            if (typeof DecompressionStream !== 'undefined') {
                try {
                    const stream = new Blob([arrayBuffer]).stream().pipeThrough(new DecompressionStream('gzip'));
                    return await new Response(stream).text();
                } catch (e) { console.warn('Fallback', e); }
            }
            if (typeof pako === 'undefined') {
                await new Promise((res, rej) => {
                    const s = document.createElement('script');
                    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js';
                    s.onload = res; s.onerror = rej; document.head.appendChild(s);
                });
            }
            return pako.inflate(new Uint8Array(arrayBuffer), { to: 'string' });
        }

        async function loadDictionary() {
            const loadingText = document.getElementById('loading-text');
            try {
                const response = await fetch('words.txt.gz?v=' + Date.now());
                if (!response.ok) throw new Error('Файл не найден');

                const buffer = await response.arrayBuffer();
                let text = await gunzipToString(buffer);
                text = text.replace(/^\uFEFF/, '');

                const wordsArray = text.split(/\r?\n/).map(w => normalizeWord(w)).filter(w => w.length > 0);
                dictionary = new Set(wordsArray);

                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('btn-start').disabled = false;
                
                updateBalanceUI();
                updateMenuUI();
            } catch (error) {
                console.error(error);
                loadingText.style.color = 'red';
                loadingText.innerText = 'Ошибка словаря';
                tg.showAlert('Ошибка: ' + error.message);
            }
        }

        loadDictionary();

        // --- НАВИГАЦИЯ ---
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function goToMenu() {
            tg.HapticFeedback.impactOccurred('light');
            updateMenuUI();
            switchScreen('screen-menu');
        }

        function showLevelSelect() {
            tg.HapticFeedback.impactOccurred('light');
            renderLevelGrid();
            switchScreen('screen-levels');
        }

        function showPvpMockup() {
            tg.HapticFeedback.impactOccurred('medium');
            switchScreen('screen-pvp');
        }

        function resetProgress() {
            tg.showPopup({
                title: 'Сброс',
                message: 'Вы уверены, что хотите сбросить весь прогресс и бонусы?',
                buttons: [ { id: 'cancel', type: 'cancel', text: 'Отмена' }, { id: 'reset', type: 'destructive', text: 'Сбросить' } ]
            }, (buttonId) => {
                if (buttonId === 'reset') {
                    maxUnlockedLevel = 1;
                    bonusBalance = 50;
                    localStorage.setItem('wordBattleMaxUnlocked', 1);
                    localStorage.setItem('wordBattleBonus', 50);
                    updateBalanceUI();
                    updateMenuUI();
                    tg.HapticFeedback.notificationOccurred('success');
                }
            });
        }

        // --- ВЫБОР ГЛАВЫ И СЕТКА УРОВНЕЙ ---
        function switchChapter(chapter) {
            currentChapterView = chapter;
            document.getElementById('tab-ch1').classList.toggle('active', chapter === 1);
            document.getElementById('tab-ch2').classList.toggle('active', chapter === 2);
            renderLevelGrid();
        }

        function renderLevelGrid() {
            const grid = document.getElementById('level-grid');
            grid.innerHTML = '';
            const start = currentChapterView === 1 ? 1 : 51;
            const end = currentChapterView === 1 ? 50 : 100;

            for (let i = start; i <= end; i++) {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.innerText = i;

                if (i < maxUnlockedLevel) { btn.classList.add('completed'); }
                else if (i === maxUnlockedLevel) { btn.classList.add('current'); }
                else { btn.classList.add('locked'); btn.innerHTML = '🔒'; }

                if (i <= maxUnlockedLevel) { btn.onclick = () => startLevel(i); }
                else { btn.onclick = () => tg.showAlert('Сначала пройди предыдущие уровни!'); }

                grid.appendChild(btn);
            }
        }

        // --- ИГРА ---
        function startLevel(levelIndex) {
            tg.HapticFeedback.impactOccurred('medium');
            currentLevelIndex = levelIndex;
            switchScreen('screen-game');
            loadLevel();
        }

        function confirmLeaveLevel() {
            if (enteredWords.length === 0 && currentWord === "") {
                showLevelSelect();
                return;
            }
            
            tg.showPopup({
                title: 'Выход',
                message: 'Вы точно хотите покинуть уровень? Весь прогресс будет утерян.',
                buttons: [ { id: 'cancel', type: 'cancel', text: 'Остаться' }, { id: 'leave', type: 'destructive', text: 'Выйти' } ]
            }, (buttonId) => {
                if (buttonId === 'leave') {
                    showLevelSelect();
                }
            });
        }

        function loadLevel() {
            enteredWords = [];
            currentWord = "";
            selectedTileElements = [];
            document.getElementById('words-container').innerHTML = '';
            document.getElementById('word-input').value = '';
            document.getElementById('current-word-display').innerText = '';

            const level = allLevels[currentLevelIndex - 1];
            document.getElementById('level-display').innerText = `Уровень ${currentLevelIndex}`;
            document.getElementById('current-task').innerText = level.text;

            const poolContainer = document.getElementById('letters-pool');
            const taskTitle = document.getElementById('task-title-text');
            const keyboardGroup = document.getElementById('keyboard-input-group');
            const tilesContainer = document.getElementById('tiles-container');

            if (level.type === 'letters') {
                taskTitle.innerText = "Составь слово из букв:";
                keyboardGroup.style.display = 'none';
                tilesContainer.style.display = 'flex';
                poolContainer.innerHTML = '';
                
                level.val.forEach((letter, index) => {
                    const tile = document.createElement('div');
                    tile.className = 'letter-tile';
                    tile.innerText = letter;
                    tile.onclick = () => clickTile(tile, letter);
                    poolContainer.appendChild(tile);
                });
            } else {
                taskTitle.innerText = "Твоё задание:";
                keyboardGroup.style.display = 'flex';
                tilesContainer.style.display = 'none';
            }

            updateProgress();
        }

        // --- ЛОГИКА КЛИКА ПО ПЛИТКАМ (ГЛАВА 2) ---
        function clickTile(tileEl, letter) {
            if (tileEl.classList.contains('used')) return;

            currentWord += letter;
            tileEl.classList.add('used');
            selectedTileElements.push(tileEl);

            document.getElementById('current-word-display').innerText = currentWord;
            tg.HapticFeedback.impactOccurred('light');
        }

        function backspaceTile() {
            if (selectedTileElements.length === 0) return;

            const lastTile = selectedTileElements.pop();
            lastTile.classList.remove('used');
            currentWord = currentWord.slice(0, -1);
            
            document.getElementById('current-word-display').innerText = currentWord;
            tg.HapticFeedback.impactOccurred('light');
        }

        function submitTileWord() {
            if (!currentWord) return;
            checkWord(currentWord, true);
        }

        function updateProgress() {
            const level = allLevels[currentLevelIndex - 1];
            document.getElementById('progress-text').innerText = `Введено: ${enteredWords.length} / ${level.target}`;
        }

        // --- СПОСОБНОСТИ ---
        function changeLetter() {
            if (bonusBalance < 10) return tg.showAlert('Недостаточно бонусов!');
            const newLetter = prompt("Введите новую букву (например: А, Б, В...):");
            if (!newLetter || !/^[а-яё]$/i.test(newLetter)) return tg.showAlert('Нужна одна русская буква!');
            
            const level = allLevels[currentLevelIndex - 1];
            if (level.type === 'letters') {
                const randomIndex = Math.floor(Math.random() * level.val.length);
                level.val[randomIndex] = newLetter.toLowerCase();
                loadLevel(); // Перерисовываем
            } else {
                level.type = 'startsWith';
                level.val = newLetter.toLowerCase();
                level.text = `Начинается на "${newLetter.toUpperCase()}"`;
                document.getElementById('current-task').innerText = level.text;
            }
            
            bonusBalance -= 10;
            updateBalanceUI();
            tg.HapticFeedback.notificationOccurred('success');
            tg.showAlert('Изменено!');
        }

        function changeCondition() {
            if (bonusBalance < 15) return tg.showAlert('Недостаточно бонусов!');
            const level = allLevels[currentLevelIndex - 1];
            if (level.type === 'letters') return tg.showAlert('В главе 2 нельзя менять условие!');
            
            // Логика для 1 главы...
        }

        // --- ВАЛИДАЦИЯ СЛОВ ---
        function checkWord(wordStr = null, isTileMode = false) {
            const input = document.getElementById('word-input');
            let rawWord = isTileMode ? wordStr : input.value.trim();
            const word = normalizeWord(rawWord);

            if (!word) return;

            if (!/^[а-я]+$/.test(word)) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert('Только русские буквы!');
                return;
            }

            if (!dictionary.has(word)) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert('Такого слова нет в словаре!');
                return;
            }

            const level = allLevels[currentLevelIndex - 1];
            
            // Проверка для главы 2 (уже собрано из плиток, так что валидация букв пройдена)
            if (level.type !== 'letters') {
                let isValid = false;
                if (level.type === 'startsWith') isValid = word.startsWith(level.val);
                else if (level.type === 'endsWith') isValid = word.endsWith(level.val);
                else if (level.type === 'contains') isValid = word.includes(level.val);
                else if (level.type === 'length') isValid = word.length === level.val;

                if (!isValid) {
                    tg.HapticFeedback.notificationOccurred('error');
                    tg.showAlert('Слово не подходит под условие!');
                    return;
                }
            }

            if (enteredWords.includes(word)) {
                tg.HapticFeedback.notificationOccurred('warning');
                tg.showAlert('Ты уже вводил это слово!');
                return;
            }

            // Успех
            tg.HapticFeedback.notificationOccurred('success');
            enteredWords.push(word);
            
            if (isTileMode) {
                // Очищаем конструктор
                currentWord = "";
                selectedTileElements.forEach(el => el.classList.remove('used'));
                selectedTileElements = [];
                document.getElementById('current-word-display').innerText = '';
            } else {
                input.value = ''; 
            }
            
            const wordItem = document.createElement('div');
            wordItem.className = 'word-item';
            wordItem.innerHTML = `<span>${rawWord}</span> <span>+1</span>`;
            document.getElementById('words-container').prepend(wordItem);

            updateProgress();

            // ПРОХОЖДЕНИЕ УРОВНЯ
            if (enteredWords.length >= level.target) {
                if (currentLevelIndex === maxUnlockedLevel) {
                    bonusBalance += 20; 
                    maxUnlockedLevel++;
                    localStorage.setItem('wordBattleMaxUnlocked', maxUnlockedLevel);
                    updateBalanceUI();
                    
                    tg.HapticFeedback.notificationOccurred('success');
                    setTimeout(() => {
                        tg.showAlert('Уровень пройден! +20 🪙');
                        showLevelSelect();
                    }, 300);
                } else {
                    tg.HapticFeedback.notificationOccurred('success');
                    setTimeout(() => {
                        tg.showAlert('Уровень пройден!');
                        showLevelSelect();
                    }, 300);
                }
            }
        }

        // Слушатель для 1 главы
        document.getElementById('word-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkWord(null, false);
        });
    </script>
</body>
</html>
