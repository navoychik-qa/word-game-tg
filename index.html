<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Battle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #999999);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 20px; display: flex; flex-direction: column;
            align-items: center; height: 100vh; box-sizing: border-box;
        }
        .screen { display: none; width: 100%; max-width: 400px; flex-direction: column; height: 100%; }
        .screen.active { display: flex; }

        .menu-title { font-size: 32px; font-weight: bold; text-align: center; margin-top: 40px; margin-bottom: 40px; }
        .btn {
            background-color: var(--btn); color: var(--btn-text);
            border: none; padding: 16px; border-radius: 12px;
            font-size: 18px; font-weight: 600; margin-bottom: 16px; cursor: pointer;
        }
        .btn:disabled { opacity: 0.5; background-color: var(--hint); }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text); }
        .level-info { font-size: 18px; font-weight: bold; }

        .task-card {
            background-color: var(--secondary-bg); padding: 20px; border-radius: 16px;
            text-align: center; margin-bottom: 20px;
        }
        .task-title { font-size: 16px; color: var(--hint); margin-bottom: 8px; }
        .task-word { font-size: 22px; font-weight: bold; color: var(--btn); }

        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input {
            flex: 1; padding: 16px; border-radius: 12px; border: 1px solid var(--hint);
            background-color: var(--bg); color: var(--text); font-size: 16px; outline: none;
        }
        .submit-btn {
            background-color: var(--btn); color: var(--btn-text); border: none;
            padding: 0 20px; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer;
        }

        .words-list { flex: 1; overflow-y: auto; padding-bottom: 20px; }
        .word-item {
            background-color: var(--secondary-bg); padding: 12px 16px; border-radius: 8px;
            margin-bottom: 8px; font-size: 16px; display: flex; justify-content: space-between;
            animation: slideIn 0.2s ease-out;
        }
        .word-item span:last-child { color: #4CAF50; font-weight: bold; }
        .progress { font-size: 16px; font-weight: bold; color: var(--btn); text-align: center; margin-top: 10px; }

        @keyframes slideIn {
            from { transform: translateY(-10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Экран загрузки */
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); display: flex; justify-content: center; align-items: center;
            flex-direction: column; z-index: 999;
        }
        .spinner {
            border: 4px solid var(--secondary-bg); border-top: 4px solid var(--btn);
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Экран загрузки словаря -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">Загрузка словаря...</div>
    </div>

    <!-- ЭКРАН 1: Меню -->
    <div id="screen-menu" class="screen active">
        <div class="menu-title">Word Battle</div>
        <button id="btn-start" class="btn" onclick="startGame()" disabled>Загрузка...</button>
        <button class="btn" onclick="tg.showAlert('Соревновательный режим в разработке!')">Один на один</button>
    </div>

    <!-- ЭКРАН 2: Игра -->
    <div id="screen-game" class="screen">
        <div class="header">
            <button class="back-btn" onclick="goToMenu()">←</button>
            <div class="level-info" id="level-display">Уровень 1</div>
            <div style="width: 24px;"></div>
        </div>

        <div class="task-card">
            <div class="task-title">Твоё задание:</div>
            <div class="task-word" id="current-task">Загрузка...</div>
        </div>

        <div class="input-group">
            <input type="text" id="word-input" placeholder="Введи слово..." autocomplete="off">
            <button class="submit-btn" onclick="checkWord()">→</button>
        </div>

        <div class="words-list" id="words-container"></div>
        <div class="progress" id="progress-text">Введено: 0 / 0</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // --- ПЕРЕМЕННЫЕ ---
        let dictionary = new Set();
        let currentLevelIndex = 0;
        let enteredWords = [];

        const levels = [
            { type: 'startsWith', val: 'к', text: 'Начинается на "К"', target: 3 },
            { type: 'endsWith', val: 'а', text: 'Заканчивается на "А"', target: 3 },
            { type: 'contains', val: 'ь', text: 'Содержит "Ь" или "Ъ"', target: 3 },
            { type: 'length', val: 5, text: 'Ровно 5 букв', target: 4 },
            { type: 'startsWith', val: 'п', text: 'Начинается на "П"', target: 4 }
        ];

        // --- РАСПАКОВКА GZIP ---
        // Приоритет: нативный DecompressionStream → pako (fallback)
        async function gunzipToString(arrayBuffer) {
            // 1) Нативный способ (Chrome 80+, Safari 16.4+, все современные Telegram WebView)
            if (typeof DecompressionStream !== 'undefined') {
                try {
                    const stream = new Blob([arrayBuffer]).stream()
                        .pipeThrough(new DecompressionStream('gzip'));
                    return await new Response(stream).text();
                } catch (e) {
                    console.warn('DecompressionStream не справился, пробуем pako...', e);
                }
            }

            // 2) Fallback через pako
            if (typeof pako === 'undefined') {
                await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js');
            }
            return pako.inflate(new Uint8Array(arrayBuffer), { to: 'string' });
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                s.onerror = () => reject(new Error('Не удалось загрузить ' + src));
                document.head.appendChild(s);
            });
        }

        // --- ЗАГРУЗКА СЛОВАРЯ ПРИ СТАРТЕ ---
        async function loadDictionary() {
            const loadingText = document.getElementById('loading-text');
            try {
                const response = await fetch('words.txt.gz');
                if (!response.ok) throw new Error('Файл words.txt.gz не найден (HTTP ' + response.status + ')');

                const buffer = await response.arrayBuffer();
                const text = await gunzipToString(buffer);

                const wordsArray = text.split(/\r?\n/)
                                      .map(w => w.trim().toLowerCase())
                                      .filter(w => w.length > 0);

                dictionary = new Set(wordsArray);
                console.log(`Словарь загружен! Слов: ${dictionary.size}`);

                // Прячем экран загрузки и включаем кнопку
                document.getElementById('loading-screen').style.display = 'none';
                const startBtn = document.getElementById('btn-start');
                startBtn.disabled = false;
                startBtn.innerText = 'Одиночный режим';

            } catch (error) {
                console.error(error);
                loadingText.style.color = 'red';
                loadingText.innerText = 'Ошибка загрузки словаря';
                tg.showAlert('Ошибка загрузки словаря: ' + error.message);
            }
        }

        // Запускаем загрузку сразу при открытии
        loadDictionary();

        // --- ЛОГИКА ИГРЫ ---
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            tg.HapticFeedback.impactOccurred('medium');
            currentLevelIndex = 0;
            switchScreen('screen-game');
            loadLevel();
        }

        function goToMenu() {
            tg.HapticFeedback.impactOccurred('light');
            switchScreen('screen-menu');
        }

        function loadLevel() {
            enteredWords = [];
            document.getElementById('words-container').innerHTML = '';
            document.getElementById('word-input').value = '';

            if (currentLevelIndex >= levels.length) {
                tg.showAlert('Поздравляю! Ты прошел все уровни!');
                goToMenu();
                return;
            }

            const level = levels[currentLevelIndex];
            document.getElementById('level-display').innerText = `Уровень ${currentLevelIndex + 1}`;
            document.getElementById('current-task').innerText = level.text;
            updateProgress();
        }

        function updateProgress() {
            const level = levels[currentLevelIndex];
            document.getElementById('progress-text').innerText =
                `Введено: ${enteredWords.length} / ${level.target}`;
        }

        function checkWord() {
            const input = document.getElementById('word-input');
            const word = input.value.trim().toLowerCase();

            if (!word) return;

            // 1. Только русские буквы
            if (!/^[а-яё]+$/.test(word)) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert('Только русские буквы!');
                return;
            }

            // 2. Проверка по словарю
            if (!dictionary.has(word)) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert('Такого слова нет в словаре!');
                return;
            }

            const level = levels[currentLevelIndex];
            let isValid = false;

            // 3. Проверка условий уровня
            if (level.type === 'startsWith') isValid = word.startsWith(level.val);
            else if (level.type === 'endsWith') isValid = word.endsWith(level.val);
            else if (level.type === 'contains') isValid = word.includes('ь') || word.includes('ъ');
            else if (level.type === 'length') isValid = word.length === level.val;

            if (!isValid) {
                tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert('Слово не подходит под условие!');
                return;
            }

            // 4. Проверка на повтор
            if (enteredWords.includes(word)) {
                tg.HapticFeedback.notificationOccurred('warning');
                tg.showAlert('Ты уже вводил это слово!');
                return;
            }

            // Успех!
            tg.HapticFeedback.notificationOccurred('success');
            enteredWords.push(word);
            input.value = '';

            const wordItem = document.createElement('div');
            wordItem.className = 'word-item';
            wordItem.innerHTML = `<span>${word}</span> <span>+1</span>`;
            document.getElementById('words-container').prepend(wordItem);

            updateProgress();

            if (enteredWords.length >= level.target) {
                tg.HapticFeedback.notificationOccurred('success');
                setTimeout(() => {
                    tg.showAlert('Уровень пройден!');
                    currentLevelIndex++;
                    loadLevel();
                }, 300);
            }
        }

        document.getElementById('word-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkWord();
        });
    </script>
</body>
</html>
